server {
    listen       7860;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Proxy API sang backend để trình duyệt chỉ nói với một origin,
    # nhờ đó không cần bật CORS ở backend.
    location /api/ {
        # DNS nội bộ của Docker. Bắt buộc phải có khi proxy_pass dùng biến.
        resolver 127.0.0.11 ipv6=off valid=10s;

        # Đặt upstream vào biến để nginx resolve lúc có request, không phải
        # lúc khởi động. Nếu hardcode tên host, nginx sẽ từ chối start khi
        # backend chưa chạy (chế độ chỉ-UI).
        set $backend_host "backend:8000";

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Index sách vài trăm trang và một lượt search đều rất lâu.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Ảnh-mục base64 rất nặng; không đệm để trả về dần.
        proxy_buffering off;
        client_max_body_size 512m;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Asset có hash trong tên nên cache vĩnh viễn được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi route khác trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
