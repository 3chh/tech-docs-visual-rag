# Kiểu SPLIT, máy A: chỉ xử lý PDF.
#
#   make deploy-worker-node
#
# Chạy trên máy GPU nhẹ (8GB đủ). Index chạy theo đợt rồi nghỉ nên máy này
# rảnh phần lớn thời gian, dùng GPU rẻ là hợp lý.

services:
  vllm:
    deploy:
      replicas: 0
  backend:
    deploy:
      replicas: 0
  frontend:
    deploy:
      replicas: 0
  qdrant:
    deploy:
      replicas: 0

  worker:
    ports:
      # Phơi ra để máy B gọi được. Giới hạn theo IP máy B nếu ở mạng công khai.
      - "${WORKER_BIND:-0.0.0.0}:${WORKER_PORT:-2222}:8001"
