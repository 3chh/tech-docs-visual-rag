# Chỉ chạy giao diện + Qdrant, không nạp model nào.
#
#   make up-ui
#
# Dùng khi muốn xem giao diện, kiểm tra build, hoặc phát triển frontend mà
# chưa có GPU. Giao diện sẽ báo mất kết nối backend — đúng như mong đợi vì
# backend không chạy ở chế độ này.
#
# Không cần GEMINI_API_KEY.

services:
  vllm:
    deploy:
      replicas: 0

  backend:
    deploy:
      replicas: 0

  worker:
    deploy:
      replicas: 0

  frontend:
    # Bỏ depends_on để frontend lên được một mình.
    depends_on: !reset []
