# Chỉ chạy giao diện + vector DB, không nạp model nào.
#
#   make up-ui
#
# Dùng khi muốn xem giao diện, kiểm tra build, hoặc phát triển frontend mà
# chưa có GPU. Frontend sẽ hiện banner "backend không kết nối được" — đúng
# như mong đợi vì backend không chạy.
#
# Không cần GEMINI_API_KEY ở chế độ này.

services:
  vllm:
    deploy:
      replicas: 0

  backend:
    deploy:
      replicas: 0

  worker:
    deploy:
      replicas: 0

  frontend:
    # Bỏ depends_on backend để frontend lên được một mình.
    depends_on: !reset []
    volumes: !override []
    environment:
      BACKEND_URL: http://backend:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
