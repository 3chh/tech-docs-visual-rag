# Override cấp GPU cho backend và worker.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Yêu cầu: NVIDIA Container Toolkit đã cài trên host.

services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
