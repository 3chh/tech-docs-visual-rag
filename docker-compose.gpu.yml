# Cấp GPU cho vllm, backend, worker.
#
# Đây là file overlay duy nhất còn lại, và nó buộc phải riêng: khối
# `deploy.resources.reservations.devices` khiến container không khởi động được
# trên máy chưa cài NVIDIA Container Toolkit, kể cả khi count=0 — Docker vẫn
# đi tìm driver rồi báo `could not select device driver "nvidia"`. Không có
# biến môi trường nào tắt được khối này, nên cách duy nhất là bỏ hẳn file.
#
# Bỏ file này ra khi chạy trên máy không có GPU (profile demo).
#
# Yêu cầu: NVIDIA Container Toolkit đã cài trên host.
# Kiểm tra:  docker run --rm --gpus all nvidia/cuda:12.1.1-base-ubuntu22.04 nvidia-smi
#
# Mặc định cả ba dùng chung GPU 0. Xem docs/MODEL_HOSTING.md để biết cách chia
# VRAM, hoặc đặt GPU_COUNT nếu máy có nhiều GPU.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: ${GPU_COUNT:-1}
            capabilities: [gpu]

services:
  vllm:
    <<: *gpu

  backend:
    <<: *gpu

  # worker KHÔNG có ở đây: Paddle chạy CPU (xem backend/Dockerfile.worker).
  # Nhờ vậy worker chạy được cả trên máy không cài NVIDIA Container Toolkit.
