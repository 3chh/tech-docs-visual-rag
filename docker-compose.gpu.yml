# Cấp GPU cho vllm, backend, worker.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#   (hoặc: make up-gpu)
#
# Yêu cầu: NVIDIA Container Toolkit đã cài trên host.
# Kiểm tra:  docker run --rm --gpus all nvidia/cuda:12.1.1-base-ubuntu22.04 nvidia-smi
#
# Mặc định cả ba dùng chung GPU 0. Xem docs/MODEL_HOSTING.md để biết cách
# chia VRAM, hoặc đặt device_ids khác nhau nếu máy có nhiều GPU.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  vllm:
    <<: *gpu

  backend:
    <<: *gpu

  worker:
    <<: *gpu
