# Triển khai lên server công khai.
#
#   make deploy-prod
#
# Khác bản dev ở ba điểm:
#   1. Chỉ Caddy phơi cổng 80/443. Backend, worker, vllm, qdrant chỉ nằm trong
#      network nội bộ của Docker.
#   2. Caddy tự xin chứng chỉ Let's Encrypt cho DOMAIN.
#   3. Bật xác thực cơ bản cho toàn site.
#
# Lý do quan trọng nhất: Qdrant KHÔNG có xác thực mặc định. Phơi cổng 6333 ra
# Internet nghĩa là ai cũng đọc và xoá được toàn bộ vector.
#
# Cần trong .env:
#   DOMAIN=chatpdf.congty.vn
#   ACME_EMAIL=ops@congty.vn
#   BASIC_AUTH_USER=cosmo
#   BASIC_AUTH_HASH=$(docker run --rm caddy caddy hash-password --plaintext 'matkhau')

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: cosmo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: "${DOMAIN:?Chua co DOMAIN de xin chung chi TLS}"
      ACME_EMAIL: ${ACME_EMAIL:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-cosmo}
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:?Chua co BASIC_AUTH_HASH, sinh bang lenh caddy hash-password}"
    depends_on:
      - frontend

  # Gỡ hết cổng: các service này chỉ nói chuyện trong network nội bộ.
  frontend:
    ports: !reset []

  backend:
    ports: !reset []

  worker:
    ports: !reset []

  vllm:
    ports: !reset []

  qdrant:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
