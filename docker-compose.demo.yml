# Kiểu DEMO: không model, dùng demo_server trả dữ liệu mẫu.
#
#   make deploy-demo
#
# Không cần GPU, không cần API key. Dùng để xem giao diện hoặc phát triển
# frontend.

services:
  vllm:
    deploy:
      replicas: 0
  worker:
    deploy:
      replicas: 0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    # Demo server không nạp model nên bỏ mọi biến liên quan.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: !reset []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
