# Cosmo ChatPDF — một file cho mọi kiểu triển khai, chọn bằng profile.
#
#   make deploy-hybrid    GPU 10GB, VLM qua API ngoài      <- khuyến nghị
#   make deploy-full      tất cả tự host, GPU 32GB
#   make deploy-demo      không model, chỉ xem giao diện
#   make deploy-prod      server công khai, HTTPS
#
# Profile đặt theo KHỐI TÀI NGUYÊN, không theo kiểu deploy, vì cùng một kiểu
# vẫn cần bật/tắt khối tuỳ VRAM của máy:
#
#   app     qdrant + backend (ColQwen ~10GB) + frontend
#   worker  PaddleOCR + PP-DocLayout, chạy CPU, chỉ cần lúc index
#   vllm    VLM tự host (~8GB), chỉ cần lúc trả lời
#   demo    backend giả trả dữ liệu mẫu + frontend, 0 GPU
#   prod    Caddy đứng trước, TLS + xác thực
#
# Kiểu deploy là tổ hợp các khối:
#   full         app,worker,vllm      hybrid    app,worker
#   worker-node  worker               gpu-node  app[,vllm]
#   demo         demo                 prod      thêm ,prod
#
# Không dùng Makefile thì gọi trực tiếp:
#   COMPOSE_PROFILES=app,worker docker compose -f docker-compose.yml \
#       -f docker-compose.gpu.yml up -d
#
# Vì sao GPU vẫn là file riêng: khối `deploy.resources.reservations.devices`
# làm container không khởi động nổi trên máy chưa cài NVIDIA Container Toolkit,
# kể cả khi đặt count=0 — Docker vẫn đi tìm driver. Biến không tắt được nó.
#
# Cổng map khớp bản chatpdf_ver_2 cũ nên agent_tung không phải sửa gì ngoài host:
#   vLLM 3333 | backend 2005 | worker 2222 | qdrant 6333/6334 | UI 7860
#
# BIND_ADDR giới hạn nơi cổng được phơi ra. Mặc định 0.0.0.0 (mọi interface)
# cho máy local; bản prod đặt 127.0.0.1 để chỉ Caddy ra Internet.

# Cố định tên project để tên volume không đổi theo tên thư mục.
name: cosmo

services:
  # --- Model serving --------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.9.2
    container_name: cosmo-vllm
    restart: unless-stopped
    profiles: ["vllm"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${VLLM_PORT:-3333}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      # Tắt engine V1 thực nghiệm của vLLM 0.9.2 để tránh crash multiprocessing trên RTX 5090 / VLM
      VLLM_USE_V1: "0"
    command:
      - --model=${VLM_MODEL_NAME:-OpenGVLab/InternVL3-8B}
      - --served-model-name=${VLM_MODEL_NAME:-OpenGVLab/InternVL3-8B}
      # Tỉ lệ VRAM của CẢ card mà vLLM được dùng (weights + KV cache).
      # InternVL3-8B bf16 nặng ~16GB nên 0.6 là sàn trên card 32GB; card 24GB
      # không đủ cho model này, phải đổi VLM_MODEL_NAME sang bản nhỏ hơn.
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.60}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-8192}
      - --trust-remote-code
      - --enforce-eager
      - --host=0.0.0.0
      - --port=8000
    ipc: host
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      # Tải model lần đầu có thể mất 10-20 phút tuỳ mạng.
      start_period: 1200s
      retries: 5

  # --- Vector database ------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: cosmo-qdrant
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${BIND_ADDR:-0.0.0.0}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      # Ảnh qdrant không có curl/wget nên dùng chính binary của nó.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Xử lý PDF ------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: cosmo-worker
    restart: unless-stopped
    profiles: ["worker"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${WORKER_PORT:-2222}:8001"
    volumes:
      - app-data:/data
      - hf-cache:/data/.cache/huggingface
    environment:
      DATA_DIR: /data
      METADATA_DIR: /data/metadata
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Không cần API key: LLM sửa mục lục do backend giải từ kết nối của bộ
      # tài liệu rồi gửi kèm custom_config trong mỗi lần gọi.
      #
      # Paddle chạy CPU nên số luồng quyết định tốc độ index. Để trống là
      # dùng mặc định của Paddle (thường bằng số core).
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3

  # --- API ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosmo-backend
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${BACKEND_PORT:-2005}:8000"
    volumes:
      - app-data:/data
      - hf-cache:/data/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      METADATA_DIR: /data/metadata
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      VECTORDB_TYPE: ${VECTORDB_TYPE:-qdrant-standalone}
      VECTORDB_URI: http://qdrant:6333
      VECTORDB_GRPC_PORT: 6334
      VECTORDB_DATABASE_NAME: ${VECTORDB_DATABASE_NAME:-cosmo}
      VECTORDB_COLLECTION_NAME: ${VECTORDB_COLLECTION_NAME:-context}

      EMBEDDING_TYPE: ${EMBEDDING_TYPE:-longcolqwen}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-tsystems/colqwen2.5-3b-multilingual-v1.0}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cuda}
      EMBEDDING_MAX_NUM_VISUAL_TOKENS: ${EMBEDDING_MAX_NUM_VISUAL_TOKENS:-8192}
      EMBEDDING_MIN_WIDTH: ${EMBEDDING_MIN_WIDTH:-600}
      EMBEDDING_MAX_TOKEN: ${EMBEDDING_MAX_TOKEN:-13000}

      # gpu-node trỏ sang worker ở máy khác bằng biến này.
      PDF_WORKER_ENDPOINT: ${PDF_WORKER_ENDPOINT:-http://worker:8001/upload_pdf/}

      # builtin = tạo sẵn kết nối tới vLLM trong stack. Chỉ đặt khi profile
      # vllm được bật; nếu không thì để none và người dùng tự thêm kết nối
      # OpenAI/Gemini trên giao diện.
      DEFAULT_VLM_PROVIDER: ${DEFAULT_VLM_PROVIDER:-none}
      BUILTIN_VLM_ENDPOINT: ${BUILTIN_VLM_ENDPOINT:-http://vllm:8000/v1}
      VLM_MODEL_NAME: ${VLM_MODEL_NAME:-OpenGVLab/InternVL3-8B}

      # Mã hoá at-rest cho key người dùng nhập trên giao diện.
      CREDENTIALS_SECRET: ${CREDENTIALS_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3

  # Bản demo: alias mạng `backend` để nginx.conf không phải đổi.
  #
  # container_name KHÔNG được đặt là cosmo-backend: alias mới là thứ nginx cần,
  # còn trùng tên container thì Docker từ chối khởi động khi stack profile app
  # còn container cũ — đổi qua lại giữa hai profile là vỡ.
  backend-demo:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    container_name: cosmo-backend-demo
    restart: unless-stopped
    profiles: ["demo"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${BACKEND_PORT:-2005}:8000"
    networks:
      default:
        aliases: ["backend"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # --- Giao diện ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cosmo-frontend
    restart: unless-stopped
    profiles: ["app", "demo"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${FRONTEND_PORT:-7860}:7860"
    # Không depends_on backend vì hai lý do: nginx.conf resolve host `backend`
    # lúc có request chứ không lúc khởi động, nên UI lên được cả khi backend
    # chưa sẵn sàng; và depends_on sang service ngoài profile đang bật là lỗi
    # cứng của compose, sẽ làm profile demo không chạy nổi.
    #
    # Không cần biến môi trường hay volume: đây là static file do nginx serve,
    # mọi lệnh gọi API đi qua proxy /api sang backend. Ảnh-mục về dưới dạng
    # base64 trong response nên frontend không cần đọc volume /data.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7860/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # --- Reverse proxy (chỉ prod) --------------------------------------------
  # Bật kèm các khối chính: COMPOSE_PROFILES=app,worker,vllm,prod
  #
  # Lý do quan trọng nhất: Qdrant KHÔNG có xác thực mặc định. Prod đặt
  # BIND_ADDR=127.0.0.1 nên qdrant, backend, worker, vllm chỉ nghe loopback
  # của host — vào được bằng SSH tunnel để debug, không vào được từ Internet.
  caddy:
    image: caddy:2.8-alpine
    container_name: cosmo-caddy
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-cosmo}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}

volumes:
  qdrant-data:
  app-data:
  # Cache model dùng chung: vLLM, ColQwen, PaddleOCR đều tải về đây một lần.
  hf-cache:
  caddy-data:
  caddy-config:
