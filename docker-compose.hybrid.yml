# Kiểu HYBRID: tự host phần bắt buộc cần GPU, VLM dùng API ngoài.
#
#   make deploy-hybrid
#
# OCR, layout và embedding phải chạy local vì chúng xử lý TOÀN BỘ tài liệu.
# VLM chỉ đọc 3-5 ảnh mỗi câu hỏi nên gửi ra API ngoài rẻ và nhanh hơn tự host,
# đồng thời tiết kiệm ~8GB VRAM.
#
# Sau khi lên, vào giao diện > Cấu hình > thêm kết nối tới OpenAI hoặc
# Gemini, rồi tạo bộ tài liệu chọn kết nối đó.

services:
  # Không chạy vLLM: đó chính là điểm của kiểu này.
  vllm:
    deploy:
      replicas: 0

  # Không cần biến gì thêm: kết nối mô hình do người dùng cấu hình trên
  # giao diện và lưu trong data/model_connections.json.
