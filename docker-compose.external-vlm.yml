# Dùng VLM host sẵn ở nơi khác thay vì chạy vLLM trong stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.external-vlm.yml up -d
#   (hoặc: make up-external-vlm)
#
# Đặt VLM_ENDPOINT trong .env trỏ tới endpoint OpenAI-compatible của bạn.

services:
  # scale 0 để service vllm không khởi động.
  vllm:
    deploy:
      replicas: 0

  backend:
    environment:
      VLM_ENDPOINT: ${VLM_ENDPOINT:?VLM_ENDPOINT phải đặt khi dùng VLM ngoài}

  worker:
    environment:
      VLM_ENDPOINT: ${VLM_ENDPOINT:?VLM_ENDPOINT phải đặt khi dùng VLM ngoài}

  frontend:
    environment:
      VLM_ENDPOINT: ${VLM_ENDPOINT:?VLM_ENDPOINT phải đặt khi dùng VLM ngoài}
